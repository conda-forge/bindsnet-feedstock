{% set name = "bindsnet" %}
{% set version = "0.3.5" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/{{ name }}/{{ name }}/archive/{{ version }}.tar.gz
  sha256: d1edc51d28469a3c572aab4dc2b734b2e53ad77404136ab241b5b31c5f380cc0

build:
  script: {{ PYTHON }} -m pip install . -vv
  number: 0
  noarch: python

requirements:
  host:
    - pip
    - python {{ python_min }}
    - poetry
    - setuptools
  run:
    - cython
    - matplotlib-base
    - numpy
    - opencv
    - pandas
    - python >={{ python_min }},<3.12
    - scikit-image
    - scikit-learn
    - scipy
    - tensorboardx
    - pytorch
    - torchvision
    - tqdm
    - foolbox
    - ale-py
    - gymnasium

test:
  requires:
    - python {{ python_min }}
  imports:
    - bindsnet

about:
  home: https://github.com/BindsNET/bindsnet
  summary: Spiking neural networks for ML in Python
  license: AGPL-3.0-only
  license_file: LICENSE

extra:
  recipe-maintainers:
    - Tobias-Fischer
